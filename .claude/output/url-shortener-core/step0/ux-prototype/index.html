<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>URL Shortener — Create Link</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 16px; font-size: 0.85rem; color: #444; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 20px; padding: 10px 18px; background: #2952e3; color: white; border: none; border-radius: 4px; cursor: pointer; }
  .hint { font-size: 0.8rem; color: #777; margin-top: 4px; }
  nav { margin-top: 30px; font-size: 0.8rem; }
  nav a { color: #2952e3; text-decoration: none; margin-right: 12px; }
</style>
</head>
<body>
  <h1>Shorten a URL</h1>
  <p class="hint">Mockup only — this prototype does not call a real API yet.</p>

  <form onsubmit="window.location.href='created.html'; return false;">
    <label>Long URL
      <input type="url" placeholder="https://example.com/some/very/long/path" required>
    </label>
    <label>Custom alias (optional)
      <input type="text" placeholder="my-link">
    </label>
    <label>Expires after (optional — default 90 days)
      <input type="text" placeholder="e.g. 30d, or leave blank">
    </label>
    <button type="submit">Create short link</button>
  </form>

  <nav>
    <a href="analytics.html">View analytics →</a>
    <a href="error.html">See expired-link screen →</a>
  </nav>
</body>
</html>
