openapi: 3.1.0
info: { title: URL Shortener API, version: 1.0.0 }
paths:
  /api/v1/links:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 2048 }
                customCode: { type: string, pattern: "^[a-zA-Z0-9]{3,32}$" }
      responses:
        "201": { description: "Created — shortCode, shortUrl, longUrl, createdAt, expiresAt" }
        "400": { description: "code=INVALID_URL_SCHEME | URL_TOO_LONG | URL_MALFORMED | INVALID_CUSTOM_CODE_SHAPE | RESERVED_CODE" }
        "409": { description: "code=CUSTOM_CODE_TAKEN" }
        "503": { description: "code=CODE_SPACE_EXHAUSTED (pathological, generated-code retry budget exhausted)" }
  /{code}:
    get:
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "302": { description: "Redirect to longUrl; records a ClickEvent (country omitted if geo lookup fails soft)" }
        "404": { description: "code=CODE_NOT_FOUND — used identically for both never-existed and expired (feature-spec.md Section 4)" }
        "429": { description: "code=RATE_LIMITED; Retry-After, X-RateLimit-Limit, X-RateLimit-Remaining headers" }
  /api/v1/links/{code}/stats:
    get:
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "shortCode, longUrl, createdAt, expiresAt, totalClicks, clicksByDay[], clicksByCountry[] — queryable even after expiry" }
        "404": { description: "code=CODE_NOT_FOUND (only for never-existed; expired-but-valid-once still returns 200)" }
