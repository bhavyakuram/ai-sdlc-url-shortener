# Valid role combinations for this project's 4 roles — scoped to what a
# single URL-shortener service needs, not a larger multi-role catalog.
# "valid: false" combinations are rejected by stack-validator at launch.
combinations:
  - roles: [fullstack]
    valid: true
    note: "Default role. All layers (api, service, data) in scope. Used for the greenfield scenario."
  - roles: [services-mod]
    valid: true
    note: "Patch existing service code, mod posture. Used for the brownfield scenario."
  - roles: [services-doc]
    valid: true
    note: "Audit-only, doc posture. No code generation — STEP-4 generator is skipped (agents_skipped)."
  - roles: [greenfield]
    valid: true
    note: "Pure ideation-to-app posture. Only role that triggers STEP-0."
  - roles: [services-mod, services-doc]
    valid: false
    note: "Conflicting postures (mod vs audit-only) in the same run — reject at stack-validator."
